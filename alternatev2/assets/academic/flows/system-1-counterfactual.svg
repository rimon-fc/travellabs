<svg xmlns="http://www.w3.org/2000/svg" width="800" height="374" viewBox="0 0 800 374" role="img" aria-labelledby="title desc"><title id="title">system 1 counterfactual</title><desc id="desc">Technical schematic. Moving marks trace selected connections; they are not live execution data.</desc><defs><pattern id="check" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#376d69"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#a5aaa4" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#376d69"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.signal{animation:travel 2.8s linear infinite}.cell-active{animation:activity 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-44}}@keyframes activity{0%,100%{opacity:1}50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.cell-active{animation:none}}</style><rect width="800" height="374" fill="#f5f4ef"/><text x="22" y="29" font-size="19" fill="#263837" text-anchor="start" font-weight="600">The same requirement, different wording</text><text x="22" y="50" font-size="12" fill="#68716c" text-anchor="start">Saved P(yes) · wording sensitivity is not a mechanistic explanation</text><path d="M22 63L778 63" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="22" y="88" font-size="13" fill="#263837" text-anchor="start">Original: children aged five and eight</text><path d="M22 111C93.76 111 88.24 111 160 111" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0s" d="M22 111C93.76 111 88.24 111 160 111" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="17" y="106" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="20" y="109" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="155" y="106" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="158" y="109" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="188" y="98" width="476" height="25" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="188" y="98" width="17.85" height="25" fill="#a37c3a" stroke="none" stroke-width=".8" /><text x="778" y="117" font-size="15" fill="#263837" text-anchor="end">3.75%</text><text x="22" y="172" font-size="13" fill="#263837" text-anchor="start">Add: this trip is all about the kids</text><path d="M22 195C93.76 195 88.24 195 160 195" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-1s" d="M22 195C93.76 195 88.24 195 160 195" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="17" y="190" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="20" y="193" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="155" y="190" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="158" y="193" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="188" y="182" width="476" height="25" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="188" y="182" width="455.86519999999996" height="25" fill="#376d69" stroke="none" stroke-width=".8" /><text x="778" y="201" font-size="15" fill="#263837" text-anchor="end">95.77%</text><text x="22" y="256" font-size="13" fill="#263837" text-anchor="start">Add: kid-friendly is a must</text><path d="M22 279C93.76 279 88.24 279 160 279" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-2s" d="M22 279C93.76 279 88.24 279 160 279" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="17" y="274" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="20" y="277" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="155" y="274" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="158" y="277" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="188" y="266" width="476" height="25" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="188" y="266" width="22.276799999999998" height="25" fill="#a37c3a" stroke="none" stroke-width=".8" /><text x="778" y="285" font-size="15" fill="#263837" text-anchor="end">4.68%</text><text x="22" y="324" font-size="12" fill="#263837" text-anchor="start">A confident wrong answer motivates a regression test, not a causal claim.</text><path d="M22 340L778 340" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="22" y="361" font-size="11" fill="#68716c" text-anchor="start">Flow animation indicates comparison only. Probabilities remain the archived source values.</text></svg>