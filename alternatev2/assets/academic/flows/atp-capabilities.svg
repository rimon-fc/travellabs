<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc"><title id="title">atp capabilities</title><desc id="desc">Technical schematic. Moving marks trace selected connections; they are not live execution data.</desc><defs><pattern id="check" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#376d69"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#a5aaa4" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#376d69"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.signal{animation:travel 2.8s linear infinite}.cell-active{animation:activity 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-44}}@keyframes activity{0%,100%{opacity:1}50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.cell-active{animation:none}}</style><rect width="800" height="410" fill="#f5f4ef"/><text x="22" y="29" font-size="19" fill="#263837" text-anchor="start" font-weight="600">A tier is not an upstream tool mapping</text><text x="22" y="50" font-size="12" fill="#68716c" text-anchor="start">Minimum declared tiers · filled = operation lies within the tier</text><path d="M22 63L778 63" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="250" y="89" font-size="13" fill="#263837" text-anchor="middle">search</text><text x="364" y="89" font-size="13" fill="#263837" text-anchor="middle">quote</text><text x="478" y="89" font-size="13" fill="#263837" text-anchor="middle">hold</text><text x="592" y="89" font-size="13" fill="#263837" text-anchor="middle">cancel</text><text x="706" y="89" font-size="13" fill="#263837" text-anchor="middle">commit</text><text x="22" y="129" font-size="13" fill="#263837" text-anchor="start">L1 / Search</text><rect x="239" y="1