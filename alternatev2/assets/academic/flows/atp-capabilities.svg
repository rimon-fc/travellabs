="22" y="282" width="360" height="29" fill="#e4ebe5" stroke="#263837" stroke-width=".8" /><text x="32" y="301" font-size="13" fill="#263837" text-anchor="start" font-weight="600">MAPPED + REACHABLE</text><text x="32" y="329" font-size="12" fill="#263837" text-anchor="start">dispatch real supplier operation</text><rect x="419" y="285" width="362" height="55" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="416" y="282" width="362" height="55" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="416" y="282" width="362" height="29" fill="#eeede7" stroke="#263837" stroke-width=".8" /><text x="426" y="301" font-size="13" fill="#263837" text-anchor="start" font-weight="600">UNMAPPED / BELOW REQUIRED TIER</text><text x="426" y="329" font-size="12" fill="#263837" text-anchor="start">coordinator-owned != supplier-confirmed</text><path d="M22 376L778 376" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="22" y="397" font-size="11" fill="#68716c" text-anchor="start">A missing mapping at a sufficient tier is a configuration gap and a refusal.</text></svg>