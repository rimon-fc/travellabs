.f .blink{animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
.paused .f .blink{animation-play-state:paused}


@media(prefers-reduced-motion:reduce){.blink{animation:none!important}.pk,.pkw,.playhead{display:none}}</style><text x="20" y="30" class="hs">(a) ATTEMPT 1 · MON 09:00</text>
      <rect x="20" y="42" width="128" height="42" class="box"/><text x="30" y="60">load_checkpoint</text><text x="30" y="75" class="s">→ none</text>
      <rect x="166" y="42" width="128" height="42" class="boxa"/><text x="176" y="60">traverse</text><text x="176" y="75" class="s">refunds.assess</text>
      <rect x="312" y="42" width="140" height="42" class="box"/><text x="322" y="60">save_checkpoint</text><text x="322" y="75" class="s">expected_revision = 0</text>
      <rect x="470" y="42" width="150" height="42" class="box"/><text x="480" y="60">request_approval</text><text x="480" y="75" class="s">key refund:QF-4417</text>
      <g class="ln arr"><path d="M148 63H164"/><path d="M294 63H310"/><path d="M452 63H468"/></g>
      <rect x="640" y="46" width="5" height="34" class="boxk"/><rect x="649" y="46" width="5" height="34" class="boxk"/>
      <text x="664" y="60">paused</text><text x="664" y="75" class="s">lease closed · permit released</text>

      <rect x="20" y="112" width="720" height="52" class="hatch"/>
      <text x="36" y="134" class="h">WAITING · MON 09:02 → THU 14:10</text>
      <text x="36" y="151" class="s" style="fill:#343e39">approval + checkpoint stored on the server; no process holds the job</text>
      <rect x="470" y="124" width="118" height="20" class="box"/><text x="529" y="138" class="xs" text-anchor="middle" style="fill:#263837">server restarted ✓</text>
      <rect x="600" y="124" width="122" height="20" class="box"/><text x="661" y="138" class="xs" text-anchor="middle" style="fill:#263837">worker redeployed ✓</text>

      <rect x="770" y="112" width="210" height="52" class="boxw"/>
      <text x="782" y="132">reviewer · Console or SDK</text><text x="782" y="150" class="s">decide_approval(id, approved)</text>
      <path d="M875 164C875 196 640 186 640 214" class="lw arrw"/>
      <text x="652" y="206" class="s halo" style="fill:#a37c3a">continuation queued</text>

      <text x="20" y="208" class="hs">(b) ATTEMPT 2 · THU 14:10 · runs from the top</text>
      <rect x="20" y="220" width="128" height="42" class="box"/><text x="30" y="238">load_checkpoint</text><text x="30" y="253" class="s">→ case, rev 1</text>
      <rect x="166" y="220" width="128" height="42" class="box" stroke-dasharray="3 3" stroke="#929b94"/><text x="176" y="238" style="fill:#929b94">traverse</text><text x="176" y="253" class="s">skipped</text>
      <rect x="312" y="220" width="140" height="42" class="box" stroke-dasharray="3 3" stroke="#929b94"/><text x="322" y="238" style="fill:#929b94">save_checkpoint</text><text x="322" y="253" class="s">skipped</text>
      <rect x="470" y="220" width="150" height="42" class="box"/><text x="480" y="238">request_approval</text><text x="480" y="253" class="s">→ stored decision</text>
      <rect x="640" y="220" width="100" height="42" class="boxk"/><text x="652" y="238" class="w">return</text><text x="652" y="253" class="xs w">approved</text>
      <g class="ln arr"><path d="M148 241H164"/><path d="M294 241H310"/><path d="M452 241H468"/><path d="M620 241H638"/></g>

      <text x="770" y="226" class="hs">(c) THE RECORDED PATH</text>
      <text x="770" y="250" class="b">refunds.request_refund</text>
      <text x="770" y="265" class="s">succeeded · attempts 2</text>
      <text x="770" y="285">└─ refunds.assess</text>
      <text x="770" y="300" class="s">exactly one step</text>
      <text x="770" y="320" class="s">prepared_on_attempt = 1</text>
      <text x="20" y="300" class="it">Resumption is replay. The checkpoint is what makes replay safe.</text>
    </svg>