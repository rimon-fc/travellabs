<svg xmlns="http://www.w3.org/2000/svg" width="800" height="456" viewBox="0 0 800 456" role="img" aria-labelledby="title desc"><title id="title">system 1 accuracy</title><desc id="desc">Technical schematic. Moving marks trace selected connections; they are not live execution data.</desc><defs><pattern id="check" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#376d69"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#a5aaa4" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#376d69"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.signal{animation:travel 2.8s linear infinite}.cell-active{animation:activity 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-44}}@keyframes activity{0%,100%{opacity:1}50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.cell-active{animation:none}}</style><rect width="800" height="456" fill="#f5f4ef"/><text x="22" y="29" font-size="19" fill="#263837" text-anchor="start" font-weight="600">Saved accuracy is uneven across travel decisions</text><text x="22" y="50" font-size="12" fill="#68716c" text-anchor="start">Synthetic Co-consult labels · archived results, not a fresh evaluation</text><path d="M22 63L778 63" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="680" y="87" font-size="11" fill="#263837" text-anchor="end">ACCURACY</text><text x="778" y="87" font-size="11" fill="#263837" text-anchor="end">N</text><text x="22" y="117" font-size="12" fill="#263837" text-anchor="start">Brief understanding</text><rect x="245" y="100" width="350" height="20" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="245" y="100" width="345.45" height="20" fill="url(#check)" stroke="none" stroke-width=".8" /><text x="680" y="116" font-size="13" fill="#263837" text-anchor="end">98.7%</text><text x="778" y="116" font-size="12" fill="#263837" text-anchor="end">1000</text><text x="22" y="148" font-size="12" fill="#263837" text-anchor="start">Hotel ranking</text><rect x="245" y="131" width="350" height="20" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="245" y="131" width="341.25" height="20" fill="url(#check)" stroke="none" stroke-width=".8" /><text x="680" y="147" font-size="13" fill="#263837" text-anchor="end">97.5%</text><text x="778" y="147" font-size="12" fill="#263837" text-anchor="end">200</text><text x="22" y="179" font-size="12" fill="#263837" text-anchor="start">Air ranking</text><rect x="245" y="162" width="350" height="20" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="245" y="162" width="339.5" height="20" fill="url(#check)" stroke="none" stroke-width=".8" /><text x="680" y="178" font-size="13" fill="#263837" text-anchor="end">97%</text><text x="778" y="178" font-size="12" fill="#263837" text-anchor="end">200</text><text x="22" y="210" font-size="12" fill="#263837" text-anchor="start">Conversation routing</text><rect x="245" y="193" width="350" height="20" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="245" y="193" width="332.5" height="20" fill="url(#check)" stroke="none" stroke-width=".8" /><text x="680" y="209" font-size="13" fill="#263837" text-anchor="end">95%</text><text x="778" y="209" font-size="12" fill="#263837" text-anchor="end">400</text><text x="22" y="241" font-size="12" fill="#263837" text-anchor="start">Filter mapping</text><rect x="245" y="224" width="350" height="20" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="245" y="224" width="323.75" height="20" fill="url(#check)" stroke="none" stroke-width=".8" /><text x="680" y="240" font-size="13" fill="#263837" text-anchor="end">92.5%</text><text x="778" y="240" font-size="12" fill="#263837" text-anchor="end">400</text><text x="22" y="272" font-size="12" fill="#263837" text-anchor="start">Tool routing</text><rect x="245" y="255" width="350" height="20" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="245" y="255" width="301.0" height="20" fill="url(#check)" stroke="none" stroke-width=".8" /><text x="680" y="271" font-size="13" fill="#263837" text-anchor="end">86%</text><text x="778" y="271" font-size="12" fill="#263837" text-anchor="end">200</text><text x="22" y="303" font-size="12" fill="#263837" text-anchor="start">Proposal review</text><rect x="245" y="286" width="350" height="20" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="245" y="286" width="280.0" height="20" fill="url(#check)" stroke="none" stroke-width=".8" /><text x="680" y="302" font-size="13" fill="#263837" text-anchor="end">80%</text><text x="778" y="302" font-size="12" fill="#263837" text-anchor="end">800</text><text x="22" y="334" font-size="12" fill="#263837" text-anchor="start">Activity matching</text><rect x="245" y="317" width="350" height="20" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="245" y="317" width="266.0" height="20" fill="url(#check)" stroke="none" stroke-width=".8" /><text x="680" y="333" font-size="13" fill="#263837" text-anchor="end">76%</text><text x="778" y="333" font-size="12" fill="#263837" text-anchor="end">200</text><text x="22" y="365" font-size="12" fill="#263837" text-anchor="start">Destination ambiguity</text><rect x="245" y="348" width="350" height="20" fill="none" stroke="#a5aaa4" stroke-width=".8" /><rect x="245" y="348" width="187.25" height="20" fill="url(#check)" stroke="none" stroke-width=".8" /><text x="680" y="364" font-size="13" fill="#263837" text-anchor="end">53.5%</text><text x="778" y="364" font-size="12" fill="#263837" text-anchor="end">400</text><text x="245.0" y="400" font-size="10" fill="#263837" text-anchor="middle">0%</text><text x="332.5" y="400" font-size="10" fill="#263837" text-anchor="middle">25%</text><text x="420.0" y="400" font-size="10" fill="#263837" text-anchor="middle">50%</text><text x="507.5" y="400" font-size="10" fill="#263837" text-anchor="middle">75%</text><text x="595.0" y="400" font-size="10" fill="#263837" text-anchor="middle">100%</text><path d="M22 422L778 422" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="22" y="443" font-size="11" fill="#68716c" text-anchor="start">Bars remain fixed. Animation elsewhere traces computation, never changes saved measurements.</text><path d="M24 408C109.28 408 102.72 408 188 408" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0s" d="M24 408C109.28 408 102.72 408 188 408" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="19" y="403" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="22" y="406" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="183" y="403" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="186" y="406" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><text x="205" y="412" font-size="11" fill="#263837" text-anchor="start">archived test record → reported metric</text></svg>