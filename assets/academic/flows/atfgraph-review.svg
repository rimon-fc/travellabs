<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc"><title id="title">atfgraph review</title><desc id="desc">Technical schematic. Moving marks trace selected connections; they are not live execution data.</desc><defs><pattern id="check" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#376d69"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#a5aaa4" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#376d69"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.signal{animation:travel 2.8s linear infinite}.cell-active{animation:activity 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-44}}@keyframes activity{0%,100%{opacity:1}50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.cell-active{animation:none}}</style><rect width="800" height="410" fill="#f5f4ef"/><text x="22" y="29" font-size="19" fill="#263837" text-anchor="start" font-weight="600">Artifact review binds the bytes being deployed</text><text x="22" y="50" font-size="12" fill="#68716c" text-anchor="start">Illustrative revision matrix · dark = changed, pale = retained, outline = unavailable</text><path d="M22 63L778 63" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="282" y="88" font-size="11" fill="#263837" text-anchor="middle">build</text><text x="364" y="88" font-size="11" fill="#263837" text-anchor="middle">review</text><text x="446" y="88" font-size="11" fill="#263837" text-anchor="middle">edit</text><text x="528" y="88" font-size="11" fill="#263837" text-anchor="middle">rebuild</text><text x="610" y="88" font-size="11" fill="#263837" text-anchor="middle">review</text><text x="692" y="88" font-size="11" fill="#263837" text-anchor="middle">deploy</text><text x="22" y="121" font-size="13" fill="#263837" text-anchor="start">agent.yaml</text><rect x="272" y="104" width="21" height="21" fill="url(#check)" stroke="#a5aaa4" stroke-width=".8" class="cell-active"/><path d="M293 114L354 114" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="354" y="104" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><path d="M375 114L436 114" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="436" y="104" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><path d="M457 114L518 114" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="518" y="104" width="21" height="21" fill="url(#check)" stroke="#a5aaa4" stroke-width=".8" class="cell-active"/><path d="M539 114L600 114" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="600" y="104" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><path d="M621 114L682 114" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="682" y="104" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><text x="22" y="155" font-size="13" fill="#263837" text-anchor="start">tools / handlers</text><rect x="272" y="138" width="21" height="21" fill="url(#check)" stroke="#a5aaa4" stroke-width=".8" class="cell-active"/><path d="M293 148L354 148" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="354" y="138" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><path d="M375 148L436 148" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="436" y="138" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><path d="M457 148L518 148" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="518" y="138" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><path d="M539 148L600 148" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="600" y="138" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><path d="M621 148L682 148" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="682" y="138" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><text x="22" y="189" font-size="13" fill="#263837" text-anchor="start">policy rules</text><rect x="272" y="172" width="21" height="21" fill="url(#check)" stroke="#a5aaa4" stroke-width=".8" class="cell-active"/><path d="M293 182L354 182" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="354" y="172" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><path d="M375 182L436 182" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="436" y="172" width="21" height="21" fill="url(#check)" stroke="#a5aaa4" stroke-width=".8" class="cell-active"/><path d="M457 182L518 182" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="518" y="172" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><path d="M539 182L600 182" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="600" y="172" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><path d="M621 182L682 182" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="682" y="172" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><text x="22" y="223" font-size="13" fill="#263837" text-anchor="start">build files</text><rect x="272" y="206" width="21" height="21" fill="url(#check)" stroke="#a5aaa4" stroke-width=".8" class="cell-active"/><path d="M293 216L354 216" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="354" y="206" width="21" height="21" fill="#e4ebe5" stroke="#a5aaa4" stroke