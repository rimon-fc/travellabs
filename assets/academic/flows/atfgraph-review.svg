5" stroke="#a5aaa4" stroke-width=".8" /><text x="22" y="291" font-size="13" fill="#263837" text-anchor="start">deploy decision</text><rect x="272" y="274" width="21" height="21" fill="none" stroke="#a5aaa4" stroke-width=".8" /><path d="M293 284L354 284" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="354" y="274" width="21" height="21" fill="none" stroke="#a5aaa4" stroke-width=".8" /><path d="M375 284L436 284" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="436" y="274" width="21" height="21" fill="none" stroke="#a5aaa4" stroke-width=".8" /><path d="M457 284L518 284" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="518" y="274" width="21" height="21" fill="none" stroke="#a5aaa4" stroke-width=".8" /><path d="M539 284L600 284" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="600" y="274" width="21" height="21" fill="none" stroke="#a5aaa4" stroke-width=".8" /><path d="M621 284L682 284" fill="none" stroke="#cbd0c9" stroke-width=".8" stroke-dasharray="2 5"/><rect x="682" y="274" width="21" height="21" fill="url(#check)" stroke="#a5aaa4" stroke-width=".8" class="cell-active"/><path d="M282 315C495.20000000000005 315 478.79999999999995 315 692 315" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0s" d="M282 315C495.20000000000005 315 478.79999999999995 315 692 315" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="277" y="310" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="280" y="313" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="687" y="310" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="690" y="313" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><text x="22" y="345" font-size="14" fill="#263837" text-anchor="start" font-weight="600">H(F_reviewed) = H(F_deploy)?</text><text x="22" y="366" font-size="12" fill="#263837" text-anchor="start">Mismatch returns to review; a match still needs deployment authority.</text><path d="M22 376L778 376" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="22" y="397" font-size="11" fill="#68716c" text-anchor="start">Illustrative record history; retained local state is not proof of an external outcome.</text></svg>