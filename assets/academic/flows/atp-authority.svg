<svg xmlns="http://www.w3.org/2000/svg" width="800" height="418" viewBox="0 0 800 418" role="img" aria-labelledby="title desc"><title id="title">atp authority</title><desc id="desc">Technical schematic. Moving marks trace selected connections; they are not live execution data.</desc><defs><pattern id="check" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#376d69"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#a5aaa4" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#376d69"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.signal{animation:travel 2.8s linear infinite}.cell-active{animation:activity 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-44}}@keyframes activity{0%,100%{opacity:1}50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.cell-active{animation:none}}</style><rect width="800" height="418" fill="#f5f4ef"/><text x="22" y="29" font-size="19" fill="#263837" text-anchor="start" font-weight="600">Three distinct authority boundaries</text><text x="22" y="50" font-size="12" fill="#68716c" text-anchor="start">Configured token verification, trusted consent and mandate policy</text><path d="M22 63L778 63" fill="none" stroke="#a5aaa4" stroke-width=".8"/><rect x="25" y="92" width="222" height="124" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="22" y="89" width="222" height="124" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="22" y="89" width="222" height="29" fill="#eeede7" stroke="#263837" stroke-width=".8" /><text x="32" y="108" font-size="13" fill="#263837" text-anchor="start" font-weight="600">TRAVELLER TOKEN</text><text x="32" y="136" font-size="12" fill="#263837" text-anchor="start">signature / expiry</text><path d="M22 144L244 144" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="32" y="159" font-size="12" fill="#263837" text-anchor="start">issuer / audience</text><path d="M22 167L244 167" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="32" y="182" font-size="12" fill="#263837" text-anchor="start">scope / amount</text><path d="M22 190L244 190" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="32" y="205" font-size="12" fill="#263837" text-anchor="start">commit-use record</text><path d="M133 213C271.84000000000003 213 261.15999999999997 294 400 294" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0s" d="M133 213C271.84000000000003 213 261.15999999999997 294 400 294" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="128" y="208" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="131" y="211" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="395" y="289" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="398" y="292" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="292" y="92" width="222" height="124" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="289" y="89" width="222" height="124" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="289" y="89" width="222" height="29" fill="#e4ebe5" stroke="#263837" stroke-width=".8" /><text x="299" y="108" font-size="13" fill="#263837" text-anchor="start" font-weight="600">CONSENT CONSTRUCT</text><text x="299" y="136" font-size="12" fill="#263837" text-anchor="start">explicit signal OR</text><path d="M289 144L511 144" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="299" y="159" font-size="12" fill="#263837" text-anchor="start">session construct</text><path d="M289 167L511 167" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="299" y="182" font-size="12" fill="#263837" text-anchor="start">approvedBy default</text><path d="M289 190L511 190" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="299" y="205" font-size="12" fill="#263837" text-anchor="start">trusted origin needed</text><path d="M400 213C400.0 213 400.0 294 400 294" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-1s" d="M400 213C400.0 213 400.0 294 400 294" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="395" y="208" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="398" y="211" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="395" y="289" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="398" y="292" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="559" y="92" width="222" height="124" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="556" y="89" width="222" height="124" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="556" y="89" width="222" height="29" fill="#eeede7" stroke="#263837" stroke-width=".8" /><text x="566" y="108" font-size="13" fill="#263837" text-anchor="start" font-weight="600">MANDATE POLICY</text><text x="566" y="136" font-size="12" fill="#263837" text-anchor="start">optional ap2_mandate</text><path d="M556 144L778 144" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="566" y="159" font-size="12" fill="#263837" text-anchor="start">object shape</text><path d="M556 167L778 167" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="566" y="182" font-size="12" fill="#263837" text-anchor="start">scope / amount cap</text><path d="M556 190L778 190" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="566" y="205" font-size="12" fill="#263837" text-anchor="start">implicit deny rules</text><path d="M667 213C528.16 213 538.84 294 400 294" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-2s" d="M667 213C528.16 213 538.84 294 400 294" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="662" y="208" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="665" y="211" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="395" y="289" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="398" y="292" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="254" y="297" width="298" height="55" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="251" y="294" width="298" height="55" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="251" y="294" width="298" height="29" fill="#e4ebe5" stroke="#263837" stroke-width=".8" /><text x="261" y="313" font-size="13" fill="#263837" text-anchor="start" font-weight="600">COMMIT BOUNDARY</text><text x="261" y="341" font-size="12" fill="#263837" text-anchor="start">check configured authority</text><text x="22" y="254" font-size="11" fill="#a37c3a" text-anchor="start">NO KEY / JWKS:</text><text x="22" y="272" font-size="11" fill="#a37c3a" text-anchor="start">token gate omitted</text><text x="22" y="372" font-size="12" fill="#263837" text-anchor="start">A truthy signal is not independent evidence of human approval.</text><path d="M22 384L778 384" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="22" y="405" font-size="11" fill="#68716c" text-anchor="start">Capability and approval must refer to the actual itinerary, amount and operation.</text></svg>