<svg class="f" viewBox="0 0 800 452" width="800" height="452" role="img" aria-label="Three seeded simulations of the formal model: the crash window, a replay-once ablation, and shared fare watching at scale." xmlns="http://www.w3.org/2000/svg"><title>Three seeded simulations of the formal model: the crash window, a replay-once ablation, and shared fare watching at scale.</title>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#c9cacd" stroke-width="1.2"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#263837"/></marker></defs>
<style>
.f text{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:11px;fill:#263837}
.f .s{font-size:9.5px;fill:#68716c}.f .xs{font-size:8.5px;fill:#68716c}
.f .h{font-size:9.5px;letter-spacing:.1em;font-weight:600}.f .hs{font-size:9px;letter-spacing:.12em;fill:#68716c}
.f .b{font-weight:600}.f .big{font-size:20px;font-weight:600}.f .ca{fill:#376d69}.f .cw{fill:#a37c3a}.f .cm{fill:#68716c}
.f .ln{stroke:#263837;stroke-width:1;fill:none}.f .lt{stroke:#c4c5c9;stroke-width:.8;fill:none}
.f .la{stroke:#376d69;stroke-width:1.3;fill:none}.f .lw{stroke:#a37c3a;stroke-width:1.3;fill:none}
.f .dash{stroke-dasharray:3 3}
.f .box{fill:#fff;stroke:#263837;stroke-width:1}.f .boxp{fill:#eeede7;stroke:#263837;stroke-width:1}
.f .boxa{fill:#e4ebe5;stroke:#376d69;stroke-width:1}.f .boxw{fill:#f0e9db;stroke:#a37c3a;stroke-width:1}
.f .boxk{fill:#263837}.f .fa{fill:#376d69}.f .fw{fill:#a37c3a}.f .fg{fill:#c9cdc6}
.f .stamp{fill:none;stroke:#a37c3a;stroke-width:1.2;stroke-dasharray:4 2}
.f .hatch{fill:url(#hatch);stroke:#bcc5ba;stroke-width:.8}
.f .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.2,.7,.2,1) both}
.f .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}
.f .fade{animation:fade .8s ease-out both}
.f .sweep{animation:sweep 4.8s linear infinite}
.f .travel{animation:travel 3.2s ease-in-out infinite}
.f .travel2{animation:travel2 3.2s ease-in-out infinite}
.f .bounce{animation:bounce 2.4s ease-in-out infinite}
.f .blink{animation:blink 1.6s steps(2,start) infinite}
@keyframes grow{from{transform:scaleX(0)}}@keyframes pop{from{transform:scale(0);opacity:0}}@keyframes fade{from{opacity:0}}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(300px)}}
@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}100%{transform:translateX(250px);opacity:1}}
@keyframes travel2{0%{transform:translateX(0);opacity:0}10%{opacity:1}60%{transform:translateX(124px);opacity:1}100%{transform:translateX(124px);opacity:0}}
@keyframes bounce{0%,100%{transform:translateX(0)}45%{transform:translateX(62px)}55%{transform:translateX(54px)}}
@keyframes blink{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.f *{animation:none!important}}</style><rect width="800" height="452" fill="#f6f5f0"/><text x="24" y="30" class="h">EXPERIMENTS ON THE MODEL · SEEDED SIMULATIONS</text><line x1="24" y1="40" x2="776" y2="40" class="lt"/><text x="24" y="62" class="h">(a) THE CRASH WINDOW</text><text x="24" y="76" class="s">10,000 simulated bookings, 5% crash</text><rect x="24" y="88" width="100" height="18" class="boxp"/><text x="30" y="100" class="xs">prepare</text><rect x="124" y="88" width="125" height="18" class="boxa"/><text x="130" y="100" class="xs">supplier effect</text><rect x="249" y="88" width="15" height="18" class="boxw"/><rect x="264" y="88" width="60" height="18" class="box"/><text x="270" y="100" class="xs">saved</text><text x="256.5" y="126" text-anchor="middle" class="xs cw">crash here = unknown outcome</text><g class="sweep"><line x1="24" y1="84" x2="24" y2="112" stroke="#a37c3a" stroke-width="2"/></g><text x="24" y="144" class="s">retry from local state</text><rect x="24" y="149" width="139.5" height="10" class="fw grow" style="animation-delay:0.3s"/><text x="169.5" y="158" class="xs fade" style="animation-delay:0.8s"><tspan class="b" style="fill:#263837">31</tspan> duplicate bookings</text><text x="24" y="174" class="s">same effect identity</text><rect x="24" y="179" width="3" height="10" class="fa grow" style="animation-delay:0.55s"/><text x="33" y="188" class="xs fade" style="animation-delay:1.05s"><tspan class="b" style="fill:#263837">0</tspan> duplicates</text><text x="24" y="204" class="s">reconcile first</text><rect x="24" y="209" width="3" height="10" class="fa grow" style="animation-delay:0.8s"/><text x="33" y="218" class="xs fade" style="animation-delay:1.3s"><tspan class="b" style="fill:#263837">0</tspan> duplicates · 416 lookups</text><text x="24" y="234" class="s">no lookup available</text><rect x="24" y="239" width="139.5" height="10" class="fg grow" style="animation-delay:1.05s"/><text x="169.5" y="248" class="xs fade" style="animation-delay:1.55s"><tspan class="b" style="fill:#263837">31</tspan> unresolved, sent to operations</text><line x1="352" y1="54" x2="352" y2="270" class="lt"/><text x="372" y="62" class="h">(b) REPLAY-ONCE ABLATION</text><text x="372" y="76" class="s">worst case over 5 crash points + restart</text><text x="560" y="98" class="xs">assessments</text><text x="660" y="98" class="xs">distinct prompts</text><text x="372" y="126" class="b ca">all rules</text><circle cx="566" cy="122" r="6" class="fa pop" style="animation-delay:0.4s"/><rect x="666" y="116" width="12" height="12" class="fa pop" style="animation-delay:0.5s"/><text x="372" y="160" class="s">no operation key</text><circle cx="566" cy="156" r="6" class="fa pop" style="animation-delay:0.7s"/><circle cx="584" cy="156" r="6" class="fw pop" style="animation-delay:0.85s"/><rect x="666" y="150" width="12" height="12" class="fa pop" style="animation-delay:0.8s"/><text x="372" y="194" class="s">no checkpoint</text><circle cx="566" cy="190" r="6" class="fa pop" style="animation-delay:1s"/><circle cx="584" cy="190" r="6" class="fw pop" style="animation-delay:1.15s"/><rect x="666" y="184" width="12" height="12" class="fa pop" style="animation-delay:1.1s"/><rect x="684" y="184" width="12" height="12" class="fw pop" style="animation-delay:1.25s"/><text x="372" y="228" class="s">neither</text><circle cx="566" cy="224" r="6" class="fa pop" style="animation-delay:1.2999999999999998s"/><circle cx="584" cy="224" r="6" class="fw pop" style="animation-delay:1.4499999999999997s"/><circle cx="602" cy="224" r="6" class="fw pop" style="animation-delay:1.5999999999999999s"/><rect x="666" y="218" width="12" height="12" class="fa pop" style="animation-delay:1.4s"/><rect x="684" y="218" width="12" height="12" class="fw pop" style="animation-delay:1.5499999999999998s"/><text x="372" y="262" class="xs">teal = correct (one); ochre = repeated work or a changed prompt</text><line x1="24" y1="284" x2="776" y2="284" class="lt"/><text x="24" y="306" class="h">(c) ONE SHARED WATCH VS EVERY TRIP POLLING</text><text x="24" y="320" class="s">120 days, every 6 h (480 checks), 27 real fare changes · supplier searches, log scale</text><text x="24" y="353" class="b">N=10</text><rect x="110" y="340" width="233.74953880924141" height="9" class="fw grow" style="animation-delay:0.6s"/><text x="349.7495388092414" y="348" class="xs">4,800 polling</text><rect x="110" y="351" width="181.117959861873" height="9" class="fa grow" style="animation-delay:0.8s"/><text x="297.11795986187303" y="359" class="xs">480 shared</text><text x="24" y="383" class="b">N=100</text><rect x="110" y="370" width="286.3811177566099" height="9" class="fw grow" style="animation-delay:1s"/><text x="402.3811177566099" y="378" class="xs">48,000 polling</text><rect x="110" y="381" width="181.117959861873" height="9" class="fa grow" style="animation-delay:1.2000000000000002s"/><text x="297.11795986187303" y="389" class="xs">480 shared</text><text x="24" y="413" class="b">N=1,000</text><rect x="110" y="400" width="339.0126967039783" height="9" class="fw grow" style="animation-delay:1.4s"/><text x="455.0126967039783" y="408" class="xs">480,000 polling</text><rect x="110" y="411" width="181.117959861873" height="9" class="fa grow" style="animation-delay:1.6s"/><text x="297.11795986187303" y="419" class="xs">480 shared</text><text x="560" y="352" class="big ca">1,000×</text><text x="560" y="370" class="s">fewer searches at N=1,000</text><text x="560" y="392" class="s">per-trip runs: 27,000</text><text x="560" y="406" class="s">instead of 480,000</text><text x="24" y="440" class="xs">Simulations of the formal model in this paper, not measurements of the production runtime.</text></svg>