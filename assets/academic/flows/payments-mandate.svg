<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 0 800 386" role="img" aria-labelledby="title desc"><title id="title">payments mandate</title><desc id="desc">Technical schematic. Moving marks trace selected connections; they are not live execution data.</desc><defs><pattern id="check" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#376d69"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#a5aaa4" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#376d69"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.signal{animation:travel 2.8s linear infinite}.cell-active{animation:activity 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-44}}@keyframes activity{0%,100%{opacity:1}50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.cell-active{animation:none}}</style><rect width="800" height="386" fill="#f5f4ef"/><text x="22" y="29" font-size="19" fill="#263837" text-anchor="start" font-weight="600">Authority is bound before the payment effect</text><text x="22" y="50" font-size="12" fill="#68716c" text-anchor="start">Proposed mandate m = (reservation, ceiling, currency, start, expiry, uses)</text><path d="M22 63L778 63" fill="none" stroke="#a5aaa4" stroke-width=".8"/><rect x="25" y="87" width="238" height="32" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="22" y="84" width="238" height="32" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="22" y="84" width="238" height="29" fill="#eeede7" stroke="#263837" stroke-width=".8" /><text x="32" y="103" font-size="13" fill="#263837" text-anchor="start" font-weight="600">reservation</text><text x="284" y="103" font-size="13" fill="#263837" text-anchor="start">approved itinerary</text><path d="M506 99C549.68 99 546.32 174 590 174" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0.0s" d="M506 99C549.68 99 546.32 174 590 174" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="501" y="94" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="504" y="97" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="585" y="169" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="588" y="172" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="25" y="130" width="238" height="32" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="22" y="127" width="238" height="32" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="22" y="127" width="238" height="29" fill="#eeede7" stroke="#263837" stroke-width=".8" /><text x="32" y="146" font-size="13" fill="#263837" text-anchor="start" font-weight="600">amount ceiling</text><text x="284" y="146" font-size="13" fill="#263837" text-anchor="start">instruction &lt;= A</text><path d="M506 142C549.68 142 546.32 174 590 174" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0.6s" d="M506 142C549.68 142 546.32 174 590 174" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="501" y="137" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="504" y="140" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="585" y="169" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="588" y="172" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="25" y="173" width="238" height="32" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="22" y="170" width="238" height="32" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="22" y="170" width="238" height="29" fill="#eeede7" stroke="#263837" stroke-width=".8" /><text x="32" y="189" font-size="13" fill="#263837" text-anchor="start" font-weight="600">currency</text><text x="284" y="189" font-size="13" fill="#263837" text-anchor="start">instruction = c</text><path d="M506 185C549.68 185 546.32 174 590 174" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-1.2s" d="M506 185C549.68 185 546.32 174 590 174" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="501" y="180" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="504" y="183" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="585" y="169" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="588" y="172" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="25" y="216" width="238" height="32" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="22" y="213" width="238" height="32" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="22" y="213" width="238" height="29" fill="#eeede7" stroke="#263837" stroke-width=".8" /><text x="32" y="232" font-size="13" fill="#263837" text-anchor="start" font-weight="600">valid interval</text><text x="284" y="232" font-size="13" fill="#263837" text-anchor="start">t0 &lt;= now &lt;= t1</text><path d="M506 228C549.68 228 546.32 174 590 174" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-1.7999999999999998s" d="M506 228C549.68 228 546.32 174 590 174" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="501" y="223" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="504" y="226" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="585" y="169" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="588" y="172" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="25" y="259" width="238" height="32" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="22" y="256" width="238" height="32" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="22" y="256" width="238" height="29" fill="#eeede7" stroke="#263837" stroke-width=".8" /><text x="32" y="275" font-size="13" fill="#263837" text-anchor="start" font-weight="600">use budget</text><text x="284" y="275" font-size="13" fill="#263837" text-anchor="start">atomic enforcement</text><path d="M506 271C549.68 271 546.32 174 590 174" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-2.4s" d="M506 271C549.68 271 546.32 174 590 174" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="501" y="266" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="504" y="269" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="585" y="169" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="588" y="172" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="593" y="138" width="188" height="78" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="590" y="135" width="188" height="78" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="590" y="135" width="188" height="29" fill="#e4ebe5" stroke="#263837" stroke-width=".8" /><text x="600" y="154" font-size="13" fill="#263837" text-anchor="start" font-weight="600">ELIGIBLE</text><text x="600" y="182" font-size="12" fill="#263837" text-anchor="start">all checks pass</text><path d="M590 190L778 190" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="600" y="205" font-size="12" fill="#263837" text-anchor="start">submit instruction</text><text x="22" y="331" font-size="13" fill="#a37c3a" text-anchor="start">CONCURRENT USE → enforce at the payment boundary</text><path d="M22 352L778 352" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="22" y="373" font-size="11" fill="#68716c" text-anchor="start">Eligibility is not capture evidence. A local counter read alone cannot prevent replay.</text></svg>