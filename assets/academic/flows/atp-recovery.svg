<svg xmlns="http://www.w3.org/2000/svg" width="800" height="418" viewBox="0 0 800 418" role="img" aria-labelledby="title desc"><title id="title">atp recovery</title><desc id="desc">Technical schematic. Moving marks trace selected connections; they are not live execution data.</desc><defs><pattern id="check" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#376d69"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#a5aaa4" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#376d69"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.signal{animation:travel 2.8s linear infinite}.cell-active{animation:activity 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-44}}@keyframes activity{0%,100%{opacity:1}50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.cell-active{animation:none}}</style><rect width="800" height="418" fill="#f5f4ef"/><text x="22" y="29" font-size="19" fill="#263837" text-anchor="start" font-weight="600">A cancelled trip can still contain an open obligation</text><text x="22" y="50" font-size="12" fill="#68716c" text-anchor="start">Illustrative failure injection · third confirmation and hotel cancellation fail</text><path d="M22 63L778 63" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="272" y="88" font-size="12" fill="#263837" text-anchor="middle">confirm</text><text x="398" y="88" font-size="12" fill="#263837" text-anchor="middle">unwind #1</text><text x="524" y="88" font-size="12" fill="#263837" text-anchor="middle">unwind #2</text><text x="664" y="88" font-size="12" fill="#263837" text-anchor="middle">final leg state</text><text x="22" y="134" font-size="14" fill="#263837" text-anchor="start" font-weight="600">flight</text><rect x="212" y="113" width="120" height="35" fill="none" stroke="#a5aaa4" stroke-width=".8" /><text x="272" y="135" font-size="11" fill="#263837" text-anchor="middle">confirmed</text><rect x="338" y="113" width="120" height="35" fill="none" stroke="#a5aaa4" stroke-width=".8" /><text x="398" y="135" font-size="11" fill="#263837" text-anchor="middle">—</text><rect x="464" y="113" width="120" height="35" fill="none" stroke="#a5aaa4" stroke-width=".8" /><text x="524" y="135" font-size="11" fill="#263837" text-anchor="middle">cancel OK</text><rect x="604" y="113" width="120" height="35" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><text x="664" y="135" font-size="11" fill="#263837" text-anchor="middle">CANCELLED</text><text x="22" y="189" font-size="14" fill="#263837" text-anchor="start" font-weight="600">hotel</text><rect x="212" y="168" width="120" height="35" fill="none" stroke="#a5aaa4" stroke-width=".8" /><text x="272" y="190" font-size="11" fill="#263837" text-anchor="middle">confirmed</text><rect x="338" y="168" width="120" height="35" fill="none" stroke="#a5aaa4" stroke-width=".8" /><text x="398" y="190" font-size="11" fill="#a37c3a" text-anchor="middle">cancel fails</text><rect x="464" y="168" width="120" height="35" fill="none" stroke="#a5aaa4" stroke-width=".8" /><text x="524" y="190" font-size="11" fill="#263837" text-anchor="middle">—</text><rect x="604" y="168" width="120" height="35" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><text x="664" y="190" font-size="11" fill="#a37c3a" text-anchor="middle">COMPENSATING</text><text x="22" y="244" font-size="14" fill="#263837" text-anchor="start" font-weight="600">activity</text><rect x="212" y="223" width="120" height="35" fill="none" stroke="#a5aaa4" stroke-width=".8" /><text x="272" y="245" font-size="11" fill="#263837" text-anchor="middle">failed</text><rect x="338" y="223" width="120" height="35" fill="none" stroke="#a5aaa4" stroke-width=".8" /><text x="398" y="245" font-size="11" fill="#263837" text-anchor="middle">—</text><rect x="464" y="223" width="120" height="35" fill="none" stroke="#a5aaa4" stroke-width=".8" /><text x="524" y="245" font-size="11" fill="#263837" text-anchor="middle">—</text><rect x="604" y="223" width="120" height="35" fill="#e4ebe5" stroke="#a5aaa4" stroke-width=".8" /><text x="664" y="245" font-size="11" fill="#263837" text-anchor="middle">CANCELLED</text><path d="M398 203V276H524V148" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0s" d="M398 203V276H524V148" fill="none" stroke="#a37c3a" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="393" y="198" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="396" y="201" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="519" y="143" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="522" y="146" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="25" y="294" width="306" height="55" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="22" y="291" width="306" height="55" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="22" y="291" width="306" height="29" fill="#eeede7" stroke="#263837" stroke-width=".8" /><text x="32" y="310" font-size="13" fill="#263837" text-anchor="start" font-weight="600">PARENT TRANSACTION</text><text x="32" y="338" font-size="12" fill="#263837" text-anchor="start">CANCELLED</text><rect x="413" y="294" width="368" height="55" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="410" y="291" width="368" height="55" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="410" y="291" width="368" height="29" fill="#e4ebe5" stroke="#263837" stroke-width=".8" /><text x="420" y="310" font-size="13" fill="#263837" text-anchor="start" font-weight="600">UNRESOLVED HOTEL</text><text x="420" y="338" font-size="12" fill="#263837" text-anchor="start">compensateFailedAt / compensateError</text><path d="M22 384L778 384" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="22" y="405" font-size="11" fill="#68716c" text-anchor="start">Continue reverse-order cancellation; retain per-leg evidence and a recovery owner.</text></svg>