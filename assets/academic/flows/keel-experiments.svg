<svg class="f" viewBox="0 0 800 452" width="800" height="452" role="img" aria-label="Keel experiments: injected instructions and early tool use are planned; brief presentation measured on a synthetic payload." xmlns="http://www.w3.org/2000/svg"><title>Keel experiments: injected instructions and early tool use are planned; brief presentation measured on a synthetic payload.</title>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#c9cacd" stroke-width="1.2"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#263837"/></marker></defs>
<style>
.f text{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:11px;fill:#263837}
.f .s{font-size:9.5px;fill:#68716c}.f .xs{font-size:8.5px;fill:#68716c}
.f .h{font-size:9.5px;letter-spacing:.1em;font-weight:600}.f .hs{font-size:9px;letter-spacing:.12em;fill:#68716c}
.f .b{font-weight:600}.f .big{font-size:20px;font-weight:600}.f .ca{fill:#376d69}.f .cw{fill:#a37c3a}.f .cm{fill:#68716c}
.f .ln{stroke:#263837;stroke-width:1;fill:none}.f .lt{stroke:#c4c5c9;stroke-width:.8;fill:none}
.f .la{stroke:#376d69;stroke-width:1.3;fill:none}.f .lw{stroke:#a37c3a;stroke-width:1.3;fill:none}
.f .dash{stroke-dasharray:3 3}
.f .box{fill:#fff;stroke:#263837;stroke-width:1}.f .boxp{fill:#eeede7;stroke:#263837;stroke-width:1}
.f .boxa{fill:#e4ebe5;stroke:#376d69;stroke-width:1}.f .boxw{fill:#f0e9db;stroke:#a37c3a;stroke-width:1}
.f .boxk{fill:#263837}.f .fa{fill:#376d69}.f .fw{fill:#a37c3a}.f .fg{fill:#c9cdc6}
.f .stamp{fill:none;stroke:#a37c3a;stroke-width:1.2;stroke-dasharray:4 2}
.f .hatch{fill:url(#hatch);stroke:#bcc5ba;stroke-width:.8}
.f .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.2,.7,.2,1) both}
.f .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}
.f .fade{animation:fade .8s ease-out both}
.f .sweep{animation:sweep 4.8s linear infinite}
.f .travel{animation:travel 3.2s ease-in-out infinite}
.f .travel2{animation:travel2 3.2s ease-in-out infinite}
.f .bounce{animation:bounce 2.4s ease-in-out infinite}
.f .blink{animation:blink 1.6s steps(2,start) infinite}
@keyframes grow{from{transform:scaleX(0)}}@keyframes pop{from{transform:scale(0);opacity:0}}@keyframes fade{from{opacity:0}}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(300px)}}
@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}100%{transform:translateX(250px);opacity:1}}
@keyframes travel2{0%{transform:translateX(0);opacity:0}10%{opacity:1}60%{transform:translateX(124px);opacity:1}100%{transform:translateX(124px);opacity:0}}
@keyframes bounce{0%,100%{transform:translateX(0)}45%{transform:translateX(62px)}55%{transform:translateX(54px)}}
@keyframes blink{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.f *{animation:none!important}}</style><rect width="800" height="452" fill="#f6f5f0"/><text x="24" y="30" class="h">EXPERIMENTS · ONE MEASURED ON SYNTHETIC DATA, TWO PLANNED</text><line x1="24" y1="40" x2="776" y2="40" class="lt"/><text x="24" y="62" class="h">(a) INJECTED INSTRUCTIONS</text><text x="24" y="76" class="s">same model · mediation on vs off</text><rect x="24" y="92" width="92" height="30" class="boxw"/><text x="32" y="105" class="xs">tool result</text><text x="32" y="116" class="xs cw">+ injection</text><rect x="146" y="92" width="64" height="30" class="boxp"/><text x="158" y="111" class="xs">model</text><line x1="116" y1="107" x2="146" y2="107" class="ln" marker-end="url(#ah)"/><line x1="210" y1="107" x2="236" y2="107" class="ln" marker-end="url(#ah)"/><rect x="236" y="88" width="14" height="38" class="boxk"/><text x="243" y="140" text-anchor="middle" class="xs">chain</text><rect x="276" y="92" width="52" height="30" class="box"/><text x="284" y="111" class="xs">tool</text><g class="travel2"><circle cx="90" cy="132" r="4" class="fw"/></g><text x="24" y="152" class="xs cw">the injected call stops at the chain</text><text x="24" y="170" class="s">measure: calls that break a</text><text x="24" y="183" class="s">business rule, per 100 tasks</text><rect x="24" y="200" width="150" height="26" class="stamp"/><text x="34" y="217" class="xs cw b blink">PLANNED · NOT YET RUN</text><line x1="352" y1="54" x2="352" y2="250" class="lt"/><text x="372" y="62" class="h">(b) USING A TOOL TOO EARLY</text><text x="372" y="76" class="s">adversarial calls before a stage unlocks</text><rect x="372" y="92" width="100" height="40" class="boxa"/><text x="380" y="108" class="xs b">intake</text><text x="380" y="122" class="xs">open</text><rect x="502" y="92" width="100" height="40" class="boxa"/><text x="510" y="108" class="xs b">resolve</text><text x="510" y="122" class="xs">open</text><rect x="632" y="92" width="100" height="40" class="hatch"/><text x="640" y="108" class="xs b">escalate</text><text x="640" y="122" class="xs">locked</text><line x1="612" y1="86" x2="612" y2="156" stroke="#263837" stroke-width="3"/><g class="bounce"><circle cx="540" cy="146" r="5" class="fw"/></g><text x="372" y="170" class="s">measure: attempts that execute</text><text x="372" y="183" class="s">expected 0 by Proposition 1</text><rect x="372" y="200" width="150" height="26" class="stamp"/><text x="382" y="217" class="xs cw b blink">PLANNED · NOT YET RUN</text><line x1="24" y1="262" x2="776" y2="262" class="lt"/><text x="24" y="284" class="h">(c) BRIEF PRESENTATION VS FULL PAYLOAD · MEASURED</text><text x="24" y="298" class="s">synthetic 40-offer flight search; tokens estimated as characters ÷ 4</text><text x="24" y="330" class="s">full payload</text><rect x="130" y="320" width="520" height="14" class="fw grow" style="animation-delay:0.3s"/><text x="656" y="331" class="xs b">6,625</text><text x="24" y="358" class="s">brief + handle</text><rect x="130" y="348" width="8.476981132075473" height="14" class="fa grow" style="animation-delay:0.7s"/><text x="148.47698113207548" y="359" class="xs b">108</text><text x="560" y="392" class="big ca fade" style="animation-delay:1.2s">61× smaller</text><text x="560" y="410" class="s">nothing lost: one call retrieves all</text><text x="24" y="392" class="s">task success with the brief: planned</text><text x="24" y="440" class="xs">Panel (c) is a measurement on synthetic data. Panels (a) and (b) are planned and report no result.</text></svg>