<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" role="img" aria-label="A trip plans, saves, waits for approval and resumes over weeks. Emitters and agent nodes all connect to one graph server that admits work, records paths and stores waits and approvals." class="framework-drawing"><style>.a1s-flow{stroke:#6e916c;stroke-width:2;stroke-dasharray:4 14;fill:none;animation:a1s-run 3s linear infinite}@keyframes a1s-run{to{stroke-dashoffset:-36}}@media(prefers-reduced-motion:reduce){.a1s-flow{animation:none}}</style><defs><pattern id="a1s-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#a6b8a8" opacity=".35"/></pattern><marker id="a1s-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#678875"/></marker><marker id="a1s-aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c4964c"/></marker></defs><rect width="540" height="240" fill="#eef2e7"/><rect width="540" height="240" fill="url(#a1s-dots)"/><path d="M28 46C70 46 74 24 120 24S176 46 222 46 284 24 330 24 392 46 436 46 488 24 512 24" fill="none" stroke="#c6d4b8" stroke-width="13" stroke-linecap="round"/><path id="a1s-rail" d="M28 46C70 46 74 24 120 24S176 46 222 46 284 24 330 24 392 46 436 46 488 24 512 24" fill="none" stroke="#739174" stroke-width="1.3" stroke-dasharray="2 3"/><circle cx="40" cy="45" r="9" fill="#f8faf3" stroke="#678875" stroke-width="1.2"/><text x="40" y="69" font-family="Neoris,Arial,sans-serif" font-size="11" fill="#325e4d" text-anchor="middle">Plan</text><circle cx="120" cy="24" r="9" fill="#f8faf3" stroke="#678875" stroke-width="1.2"/><text x="120" y="10" font-family="Neoris,Arial,sans-serif" font-size="11" fill="#325e4d" text-anchor="middle">Save</text><circle cx="222" cy="46" r="9" fill="#f8faf3" stroke="#678875" stroke-width="1.2"/><text x="222" y="70" font-family="Neoris,Arial,sans-serif" font-size="11" fill="#325e4d" text-anchor="middle">Wait for approval</text><circle cx="330" cy="24" r="9" fill="#f8faf3" stroke="#678875" stroke-width="1.2"/><text x="330" y="10" font-family="Neoris,Arial,sans-serif" font-size="11" fill="#325e4d" text-anchor="middle">Resume</text><circle cx="436" cy="46" r="9" fill="#f8faf3" stroke="#678875" stroke-width="1.2"/><text x="436" y="70" font-family="Neoris,Arial,sans-serif" font-size="11" fill="#325e4d" text-anchor="middle">Watch fares</text><circle cx="508" cy="24" r="9" fill="#f8faf3" stroke="#678875" stroke-width="1.2"/><text x="508" y="10" font-family="Neoris,Arial,sans-serif" font-size="11" fill="#325e4d" text-anchor="middle">Depart</text><g fill="none" stroke="#72907c" stroke-width="1.3"><path d="M36 45h8m-4-4v8M116 20h8v8h-8zM219 42v8m6-8v8M327 20l7 4-7 4zM433 46a3 3 0 1 0 6 0a3 3 0 1 0 -6 0M505 29v-10l7 3-7 3"/></g><circle r="4.5" fill="#d8a85a" stroke="#fffdf5" stroke-width="2"><animateMotion dur="10s" repeatCount="indefinite" path="M28 46C70 46 74 24 120 24S176 46 222 46 284 24 330 24 392 46 436 46 488 24 512 24"/></circle><text x="24" y="96" font-family="Departure,ui-monospace,monospace" font-size="9" fill="#6b7b6e" text-anchor="start" letter-spacing=".06em">EMITTERS</text><text x="270" y="96" font-family="Departure,ui-monospace,monospace" font-size="9" fill="#6b7b6e" text-anchor="middle" letter-spacing=".06em">GRAPH SERVER</text><text x="516" y="96" font-family="Departure,ui-monospace,monospace" font-size="9" fill="#6b7b6e" text-anchor="end" letter-spacing=".06em">AGENT NODES</text><rect x="24" y="106" width="86" height="24" rx="3" fill="#f8faf3" stroke="#bfc8b4"/><text x="67" y="122" font-family="Neoris,Arial,sans-serif" font-size="11.5" fill="#325e4d" text-anchor="middle">Schedule</text><path d="M110 118C138 118 136 150 162 150" fill="none" stroke="#a6b09a" stroke-width="1.2" marker-end="url(#a1s-ah)"/><path class="a1s-flow" d="M110 118C138 118 136 150 162 150"/><rect x="24" y="138" width="86" height="24" rx="3" fill="#f6ecd