<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" role="img" aria-label="A brief becomes agent.yaml, passes schema, evaluation and trust checks, and ships as a hashed bundle. At runtime flights, stays and experiences connect through checked tools to clear permission, with every call audited." class="framework-drawing"><style>.k1s-flow{stroke:#6e916c;stroke-width:2;stroke-dasharray:5 20;fill:none;animation:k1s-run 4s linear infinite}@keyframes k1s-run{to{stroke-dashoffset:-50}}@media(prefers-reduced-motion:reduce){.k1s-flow{animation:none}}</style><defs><pattern id="k1s-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#b6b49b" opacity=".35"/></pattern><marker id="k1s-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#678875"/></marker><marker id="k1s-aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c4964c"/></marker></defs><rect width="540" height="240" fill="#f1f0e5"/><rect width="540" height="240" fill="url(#k1s-dots)"/><text x="24" y="22" font-family="Departure,ui-monospace,monospace" font-size="9" fill="#7a806c" text-anchor="start" letter-spacing=".06em">BUILD ONCE</text><text x="24" y="116" font-family="Departure,ui-monospace,monospace" font-size="9" fill="#7a806c" text-anchor="start" letter-spacing=".06em">ACT WITHIN RULES</text><rect x="24" y="34" width="76" height="34" rx="3" fill="#fcfcf5" stroke="#bfc8b4"/><text x="62" y="55" font-family="Neoris,Arial,sans-serif" font-size="12" fill="#375b49" text-anchor="middle">Brief</text><rect x="124" y="34" width="92" height="34" rx="3" fill="#fcfcf5" stroke="#bfc8b4"/><text x="170" y="55" font-family="Neoris,Arial,sans-serif" font-size="12" fill="#375b49" text-anchor="middle">agent.yaml</text><rect x="240" y="28" width="150" height="46" rx="6" fill="#e2e9d6" stroke="#a9b99f"/><path d="M252 50l5 5 9-10" fill="none" stroke="#50765