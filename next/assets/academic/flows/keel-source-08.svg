<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370" role="img" aria-labelledby="title desc"><title id="title">keel source 08</title><desc id="desc">Technical schematic. Moving marks trace selected connections; they are not live execution data.</desc><defs><pattern id="check" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#376d69"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#a5aaa4" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#376d69"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.signal{animation:travel 2.8s linear infinite}.cell-active{animation:activity 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-44}}@keyframes activity{0%,100%{opacity:1}50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.cell-active{animation:none}}</style><rect width="800" height="370" fill="#f5f4ef"/><text x="22" y="29" font-size="19" fill="#263837" text-anchor="start" font-weight="600">Release is a conjunction of independent checks</text><text x="22" y="50" font-size="12" fill="#68716c" text-anchor="start">A passing build is eligible for distribution, not customer-transaction authority</text><path d="M22 63L778 63" fill="none" stroke="#a5aaa4" stroke-width=".8"/><rect x="25" y="112" width="180" height="101" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="22" y="109" width="180" height="101" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="22" y="109" width="180" height="29" fill="#eeede7" stroke="#263837" stroke-width=".8" /><text x="32" y="128" font-size="13" fill="#263837" text-anchor="start" font-weight="600">BUILD INPUT</text><text x="32" y="156" font-size="12" fill="#263837" text-anchor="start">agent.yaml</text><path d="M22 164L202 164" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="32" y="179" font-size="12" fill="#263837" text-anchor="start">references / tools</text><path d="M22 187L202 187" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="32" y="202" font-size="12" fill="#263837" text-anchor="start">bundle contents</text><rect x="289" y="87" width="224" height="101" fill="url(#hatch)" stroke="none" stroke-width=".8" /><rect x="286" y="84" width="224" height="101" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="286" y="84" width="224" height="29" fill="#e4ebe5" stroke="#263837" stroke-width=".8" /><text x="296" y="103" font-size="13" fill="#263837" text-anchor="start" font-weight="600">REFUSING GATES</text><text x="296" y="131" font-size="12" fill="#263837" text-anchor="start">schema validation</text><path d="M286 139L510 139" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="296" y="154" font-size="12" fill="#263837" text-anchor="start">evaluation suite</text><path d="M286 162L510 162" fill="none" stroke="#d4d7cf" stroke-width=".8"/><text x="296" y="177" font-size="12" fill="#263837" text-anchor="start">trust scan</text><path d="M202 142C245.68 142 242.32 131 286 131" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0s" d="M202 142C245.68 142 242.32 131 286 131" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="197" y="137" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="200" y="140" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="281" y="126" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="284" y="129" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><path d="M202 165C245.68 165 242.32 154 286 154" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-1s" d="M202 165C245.68 165 242.32 154 286 