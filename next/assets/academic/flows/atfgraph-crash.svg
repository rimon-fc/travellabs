<svg xmlns="http://www.w3.org/2000/svg" width="800" height="396" viewBox="0 0 800 396" role="img" aria-labelledby="title desc"><title id="title">atfgraph crash</title><desc id="desc">Technical schematic. Moving marks trace selected connections; they are not live execution data.</desc><defs><pattern id="check" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#376d69"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#a5aaa4" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#376d69"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.signal{animation:travel 2.8s linear infinite}.cell-active{animation:activity 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-44}}@keyframes activity{0%,100%{opacity:1}50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.cell-active{animation:none}}</style><rect width="800" height="396" fill="#f5f4ef"/><text x="22" y="29" font-size="19" fill="#263837" text-anchor="start" font-weight="600">A lost reply leaves an unresolved external effect</text><text x="22" y="50" font-size="12" fill="#68716c" text-anchor="start">Retain the original identity; obtain authoritative evidence before retrying</text><path d="M22 63L778 63" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="106" y="89" font-size="12" fill="#263837" text-anchor="middle">Local worker</text><path d="M106 102L106 335" fill="none" stroke="#a5aaa4" stroke-width=".8" stroke-dasharray="3 5"/><text x="300" y="89" font-size="12" fill="#263837" text-anchor="middle">Durable store</text><path d="M300 102L300 335" fill="none" stroke="#a5aaa4" stroke-width=".8" stroke-dasharray="3 5"/><text x="498" y="89" font-size="12" fill="#263837" text-anchor="middle">Supplier</text><path d="M498 102L498 335" fill="none" stroke="#a5aaa4" stroke-width=".8" stroke-dasharray="3 5"/><text x="700" y="89" font-size="12" fill="#263837" text-anchor="middle">Recovery owner</text><path d="M700 102L700 335" fill="none" stroke="#a5aaa4" stroke-width=".8" stroke-dasharray="3 5"/><path d="M106 124C206.88 124 199.12 124 300 124" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0.0s" d="M106 124C206.88 124 199.12 124 300 124" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="101" y="119" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="104" y="122" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="295" y="119" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="298" y="122" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><text x="203.0" y="114" font-size="12" fill="#263837" text-anchor="middle">persist intent + identity</text><path d="M106 167C309.84000000000003 167 294.15999999999997 167 498 167" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0.6s" d="M106 167C309.84000000000003 167 294.15999999999997 167 498 167" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="101" y="162" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="104" y="165" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="493" y="162" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="496" y="165" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><text x="302.0" y="157" font-size="12" fill="#263837" text-anchor="middle">commit(effect_id)</text><text x="498.0" y="195" font-size="12" fill="#263837" text-anchor="middle">effect may exist</text><path d="M498 240C294.15999999999997 240 309.84000000000003 240 106 240" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-1.7999999999999998s" d="M498 240C294.15999999999997 240 309.84000000000003 240 106 240" fill="none" stroke="#a37c3a" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="493" y="235" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="496" y="238" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="101" y="235" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="104" y="238" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><text x="302.0" y="230" font-size="12" fill="#a37c3a" text-anchor="middle">reply lost / worker exits</text><path d="M700 283C594.96 283 603.04 283 498 283" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-2.4s" d="M700 283C594.96 283 603.04 283 498 283" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="695" y="278" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="698" y="281" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="493" y="278" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="496" y="281" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><text x="599.0" y="273" font-size="12" fill="#263837" text-anchor="middle">query original identity</text><path d="M498 327C395.03999999999996 327 402.96000000000004 327 300 327" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-3.0s" d="M498 327C395.03999999999996 327 402.96000000000004 327 300 327" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="493" y="322" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="496" y="325" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="295" y="322" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="298" y="325" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><text x="399.0" y="317" font-size="12" fill="#263837" text-anchor="middle">known result / pending case</text><rect x="27" y="218" width="746" height="33" fill="none" stroke="#a37c3a" stroke-width=".8" /><path d="M22 362L778 362" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="22" y="383" font-size="11" fill="#68716c" text-anchor="start">Unknown is not failed. Exactly-once effects need a participant-level contract.</text></svg>