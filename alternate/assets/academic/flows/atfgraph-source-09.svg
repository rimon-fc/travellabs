      <g class="lt dash"><path d="M390 52V282M670 52V282"/></g><path d="M530 52V282" class="ln"/>
      <g class="ln arr"><path d="M528 70H392"/><path d="M532 84H668"/></g>
      <g class="xs" text-anchor="middle"><text x="460" y="66">read · rev 3</text><text x="600" y="80">read · rev 3</text></g>
      <path d="M392 112H528" class="la arra"/><text x="460" y="108" class="xs" text-anchor="middle" style="fill:#376d69">set(expected 3)</text><text x="540" y="116" class="xs" style="fill:#52735b">rev 4 ✓</text>
      <path d="M668 140H532" class="lw arrw"/><text x="600" y="136" class="xs" text-anchor="middle" style="fill:#a37c3a">set(expected 3)</text><text x="540" y="160" class="xs" style="fill:#a37c3a">409 revision_conflict</text>
      <path d="M532 178H668" class="ln arr"/><text x="600" y="174" class="xs" text-anchor="middle">re-read · rev 4</text>
      <path d="M668 206H532" class="la arra"/><text x="600" y="202" class="xs" text-anchor="middle" style="fill:#376d69">set(expected 4)</text><text x="540" y="224" class="xs" style="fill:#52735b">rev 5 ✓</text>
      <text x="680" y="196" class="xs">update()</text><text x="680" y="207" class="xs">retries</text>
