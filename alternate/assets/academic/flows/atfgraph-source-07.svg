<svg class="f" viewBox="0 0 1000 400" role="img" aria-label="Emitter compute. Four sources feed a five-stage pipeline in the graph server: verify, dedupe, filter, transform, admit. Each stage has a refusal exit. Admitted deliveries wake the relevant agents." width="1000" height="400" xmlns="http://www.w3.org/2000/svg">
      <title>Emitter compute. Four sources feed a five-stage pipeline in the graph server: verify, dedupe, filter, transform, admit. Each stage has a refusal exit. Admitted deliveries wake the relevant agents.</title><defs>
