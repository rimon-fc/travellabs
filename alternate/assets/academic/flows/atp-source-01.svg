<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">atp source 01</title><desc id="desc">Technical schematic. Moving marks trace selected connections; they are not live execution data.</desc><defs><pattern id="check" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#376d69"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#a5aaa4" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#376d69"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.signal{animation:travel 2.8s linear infinite}.cell-active{animation:activity 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-44}}@keyframes activity{0%,100%{opacity:1}50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.cell-active{animation:none}}</style><rect width="800" height="420" fill="#f5f4ef"/><text x="22" y="29" font-size="19" fill="#263837" text-anchor="start" font-weight="600">A journey is a set of independently observed obligations</text><text x="22" y="50" font-size="12" fill="#68716c" text-anchor="start">ATP alpha / draft v0.3 · consent must precede every commit path</text><path d="M22 63L778 63" fill="none" stroke="#a5aaa4" stroke-width=".8"/><rect x="22" y="92" width="110" height="38" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><text x="77" y="116" font-size="13" fill="#263837" text-anchor="middle">search</text><path d="M132 111C141.36 111 140.64 111 150 111" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0.0s" d="M132 111C141.36 111 140.64 111 150 111" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="127" y="106" width="10" height="10" fi