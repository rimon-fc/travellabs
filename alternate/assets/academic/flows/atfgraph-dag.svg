<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">atfgraph dag</title><desc id="desc">Technical schematic. Moving marks trace selected connections; they are not live execution data.</desc><defs><pattern id="check" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#376d69"/></pattern><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#a5aaa4" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#376d69"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.signal{animation:travel 2.8s linear infinite}.cell-active{animation:activity 5s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-44}}@keyframes activity{0%,100%{opacity:1}50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.cell-active{animation:none}}</style><rect width="800" height="360" fill="#f5f4ef"/><text x="22" y="29" font-size="19" fill="#263837" text-anchor="start" font-weight="600">Dependencies determine the critical path</text><text x="22" y="50" font-size="12" fill="#68716c" text-anchor="start">Synthetic units · parallel searches, then join and draft</text><path d="M22 63L778 63" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="204" y="90" font-size="11" fill="#263837" text-anchor="middle">0</text><path d="M204 103L204 276" fill="none" stroke="#d3d6cf" stroke-width=".8" stroke-dasharray="2 5"/><text x="263" y="90" font-size="11" fill="#263837" text-anchor="middle">1</text><path d="M263 103L263 276" fill="none" stroke="#d3d6cf" stroke-width=".8" stroke-dasharray="2 5"/><text x="322" y="90" font-size="11" fill="#263837" text-anchor="middle">2</text><path d="M322 103L322 276" fill="none" stroke="#d3d6cf" stroke-width=".8" stroke-dasharray="2 5"/><text x="381" y="90" font-size="11" fill="#263837" text-anchor="middle">3</text><path d="M381 103L381 276" fill="none" stroke="#d3d6cf" stroke-width=".8" stroke-dasharray="2 5"/><text x="440" y="90" font-size="11" fill="#263837" text-anchor="middle">4</text><path d="M440 103L440 276" fill="none" stroke="#d3d6cf" stroke-width=".8" stroke-dasharray="2 5"/><text x="499" y="90" font-size="11" fill="#263837" text-anchor="middle">5</text><path d="M499 103L499 276" fill="none" stroke="#d3d6cf" stroke-width=".8" stroke-dasharray="2 5"/><text x="558" y="90" font-size="11" fill="#263837" text-anchor="middle">6</text><path d="M558 103L558 276" fill="none" stroke="#d3d6cf" stroke-width=".8" stroke-dasharray="2 5"/><text x="617" y="90" font-size="11" fill="#263837" text-anchor="middle">7</text><path d="M617 103L617 276" fill="none" stroke="#d3d6cf" stroke-width=".8" stroke-dasharray="2 5"/><text x="676" y="90" font-size="11" fill="#263837" text-anchor="middle">8</text><path d="M676 103L676 276" fill="none" stroke="#d3d6cf" stroke-width=".8" stroke-dasharray="2 5"/><text x="735" y="90" font-size="11" fill="#263837" text-anchor="middle">9</text><path d="M735 103L735 276" fill="none" stroke="#d3d6cf" stroke-width=".8" stroke-dasharray="2 5"/><text x="22" y="125" font-size="13" fill="#263837" text-anchor="start">flights</text><rect x="204" y="107" width="236" height="24" fill="url(#check)" stroke="#376d69" stroke-width=".8" /><text x="210" y="124" font-size="12" fill="#263837" text-anchor="start">4</text><text x="22" y="159" font-size="13" fill="#263837" text-anchor="start">hotels</text><rect x="204" y="141" width="354" height="24" fill="url(#check)" stroke="#376d69" stroke-width=".8" /><text x="210" y="158" font-size="12" fill="#263837" text-anchor="start">6</text><text x="22" y="193" font-size="13" fill="#263837" text-anchor="start">activities</text><rect x="204" y="175" width="177" height="24" fill="url(#check)" stroke="#376d69" stroke-width=".8" /><text x="210" y="192" font-size="12" fill="#263837" text-anchor="start">3</text><text x="22" y="227" font-size="13" fill="#263837" text-anchor="start">join</text><rect x="558" y="209" width="59" height="24" fill="url(#check)" stroke="#376d69" stroke-width=".8" /><text x="564" y="226" font-size="12" fill="#263837" text-anchor="start">1</text><text x="22" y="261" font-size="13" fill="#263837" text-anchor="start">draft</text><rect x="617" y="243" width="118" height="24" fill="url(#check)" stroke="#376d69" stroke-width=".8" /><text x="623" y="260" font-size="12" fill="#263837" text-anchor="start">2</text><path d="M440 119C501.36 119 496.64 221 558 221" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-0s" d="M440 119C501.36 119 496.64 221 558 221" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="435" y="114" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="438" y="117" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="553" y="216" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="556" y="219" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><path d="M558 153C558.0 153 558.0 221 558 221" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-1s" d="M558 153C558.0 153 558.0 221 558 221" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="553" y="148" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="556" y="151" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="553" y="216" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="556" y="219" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><path d="M381 187C473.04 187 465.96 221 558 221" fill="none" stroke="#a5aaa4" stroke-width="1"/><path class="signal" style="animation-delay:-2s" d="M381 187C473.04 187 465.96 221 558 221" fill="none" stroke="#376d69" stroke-width="2.5" stroke-dasharray="3 8" marker-end="url(#arrow)"/><rect x="376" y="182" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="379" y="185" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><rect x="553" y="216" width="10" height="10" fill="#f5f4ef" stroke="#263837" stroke-width=".8" /><rect x="556" y="219" width="4" height="4" fill="#376d69" stroke="none" stroke-width=".8" /><text x="22" y="306" font-size="15" fill="#263837" text-anchor="start" font-weight="600">T_min = max(4, 6, 3) + 1 + 2 = 9</text><path d="M22 326L778 326" fill="none" stroke="#a5aaa4" stroke-width=".8"/><text x="22" y="347" font-size="11" fill="#68716c" text-anchor="start">Idealized lower bound. Queueing, resource limits and retries add time; not a benchmark.</text></svg>